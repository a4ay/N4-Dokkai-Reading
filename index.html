
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokkai</title>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --hover-bg: #f1f5f9;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.35rem;
      margin-top: 0;
      color: #0f172a;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }

    .instructions {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }

    /* Hard refresh button */
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      margin-bottom: 18px;
      background: #0f172a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .refresh-btn:hover {
      background: #334155;
    }

    .refresh-btn span {
      font-size: 1.1rem;
    }

    /* Page list */
    .page-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .page-list a {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      line-height: 1.6;
      transition: all 0.2s ease;
    }

    .page-list a:hover {
      background: var(--hover-bg);
      border-color: #cbd5e1;
    }

    .page-num {
      font-weight: bold;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
    }

    .page-title {
      font-weight: bold;
      margin-right: 8px;
    }

    .page-sub {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>読解 (Dokkai)</h1>

    <button class="refresh-btn" onclick="hardRefresh()">
      <span>↻</span> Hard Refresh
    </button>

    <div class="instructions">
      問題を選んでください。(Choose a reading passage to start.)
    </div>

    <ul class="page-list" id="pageList"></ul>
  </div>

  <script>
    function hardRefresh() {
      const url = new URL(window.location.href);
      url.searchParams.set('_refresh', Date.now());
      window.location.replace(url.toString());
    }
  </script>

  <script src="pages.js"></script>

  <script>
    // Render a link for each file listed in pages.js
    const pageList = document.getElementById('pageList');

    PAGES.forEach(file => {
      // e.g. Problem-01_Jorge-DVD-Return.html -> "01", "Jorge DVD Return"
      const match = file.match(/^Problem-(\d+)_(.+)\.html$/);
      const num = match ? match[1] : '';
      const label = match ? match[2].replace(/-/g, ' ') : file.replace(/\.html$/, '');
      const title = num ? `もんだい ${Number(num)}` : label;

      const li = document.createElement('li');

      li.innerHTML = `
        <a href="pages/${encodeURIComponent(file)}">
          <span class="page-num">${num}</span>
          <span>
            <span class="page-title">${title}</span>
            <span class="page-sub">${num ? label : ''}</span>
          </span>
        </a>`;

      pageList.appendChild(li);
    });
  </script>

</body>
</html>
